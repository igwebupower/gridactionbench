[project]
name = "gridactionbench"
version = "0.1.0"
description = "An open benchmark for evaluating AI actions in energy systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
gridactionbench = "gridactionbench.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridactionbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
